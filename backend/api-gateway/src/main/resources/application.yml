spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # User routes - public endpoints
        - id: user-register
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/register
            - Method=POST

        - id: user-login
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/login
            - Method=POST

        # User routes - authenticated
        - id: user-profile
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/profile
          filters:
            - JwtAuthentication

        # Advertisement routes - authenticated
        - id: advertisements
          uri: http://localhost:8081
          predicates:
            - Path=/api/advertisements/**
          filters:
            - JwtAuthentication

        # Match routes - authenticated
        - id: matches
          uri: http://localhost:8081
          predicates:
            - Path=/api/matches/**
          filters:
            - JwtAuthentication

        # ML Service routes - internal only (no external access)
        # Not exposed through gateway

      # CORS configuration moved to CorsConfiguration.kt
      # Using CorsWebFilter bean for proper Spring Cloud Gateway CORS support

server:
  port: 8080

# JWT Configuration
jwt:
  secret: changeme-secret-key-for-development-must-be-at-least-256-bits
  expiration: 86400000 # 24 hours in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.videomatch: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
