spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    com.videomatch: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
