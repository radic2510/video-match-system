version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: videomatch-postgres
    environment:
      POSTGRES_DB: videomatch
      POSTGRES_USER: videomatch
      POSTGRES_PASSWORD: changeme123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - videomatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videomatch -d videomatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - videomatch-network

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    volumes:
      - ./backend:/app
      - gradle_cache:/home/gradle/.gradle
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - videomatch-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../infrastructure/docker/ml-service/Dockerfile
    volumes:
      - ./ml-service:/app
      - ./models:/app/models:ro
      - ml_cache:/app/.cache
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - videomatch-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - videomatch-network

volumes:
  postgres_data:
  gradle_cache:
  ml_cache:

networks:
  videomatch-network:
    driver: bridge
